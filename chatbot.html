<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            background: #f4f4f4;
        }
        
        h2 {
            text-align: center;
            color: #333;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .chat-container {
            width: 100%;
            height: 85vh;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #007bff transparent;
            display: flex;
            flex-direction: column;
        }
        
        .chatbox::-webkit-scrollbar {
            width: 6px;
        }
        
        .chatbox::-webkit-scrollbar-thumb {
            background: #007bff;
            border-radius: 10px;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
        }
        
        button {
            padding: 15px 25px;
            border: none;
            background: #003366;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s, transform 0.2s;
        }
        
        button:hover {
            background: #3f506f;
            transform: scale(1.05);
        }
        
        .user-message, .bot-message {
            text-align: left;
            color: white;
            background: #005599;
            padding: 12px;
            border-radius: 15px;
            display: inline-block;
            margin: 8px 0;
            max-width: 70%;
        }
        
        .user-message {
            align-self: flex-end;
        }

        .bot-message {
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <h2>Legal Chatbot</h2>
    <div class="chat-container">
        <div class="chatbox" id="chatbox">
            <p class="bot-message"><b>Zia:</b> Hi there! I am your Legal Chatbot...<br> Feel free to ask me any legal question.</p>
        </div>
        <div class="input-container">
            <input type="text" id="question" placeholder="Type your question...">
            <button onclick="askBot()">Ask</button>
        </div>
    </div>

    <script>
        function askBot() {
            let userInput = document.getElementById("question").value;
            if (!userInput.trim()) return; 

            let chatbox = document.getElementById("chatbox");
            let userMessage = document.createElement("p");
            userMessage.className = "user-message";
            userMessage.innerHTML = `<b>You:</b> ${userInput}`;
            chatbox.appendChild(userMessage);
            
            fetch("http://127.0.0.1:5000/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: userInput })
            })
            .then(response => response.json())
            .then(data => {
                let botMessage = document.createElement("p");
                botMessage.className = "bot-message";
                botMessage.innerHTML = `<b>Zia:</b> ${data.answer}`;
                chatbox.appendChild(botMessage);
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                let botMessage = document.createElement("p");
                botMessage.className = "bot-message";
                botMessage.innerHTML = `<b>Zia:</b> Sorry, something went wrong.`;
                chatbox.appendChild(botMessage);
            });
            
            document.getElementById("question").value = "";
        }
    </script>
</body>
</html>
