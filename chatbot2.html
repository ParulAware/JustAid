<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="C:\Users\skawa\OneDrive\Desktop\pbl\JUSTAID  LOGO.png" sizes="512x512" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            background: #f4f4f4;
            padding: 0 10px;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            color: #003366;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
        }

        .chatbox {
            width: 100%;
            height: 90vh;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .chatbox::-webkit-scrollbar {
            width: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .chatbox::-webkit-scrollbar-thumb {
            background: #003366;
            border-radius: 5px;
            
        }

        .input-container {
            display: flex;
            gap: 10px;
            padding: 10px;
            width: 100%;
            position: absolute;
            bottom: 20px;
            left: 0;
            background: #fff;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.1);
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
        }

        button {
            padding: 15px 25px;
            border: none;
            background: #003366;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #004d99;
            transform: scale(1.05);
        }

        .user-message, .bot-message {
            text-align: left;
            color: white;
            background: #005599;
            padding: 12px;
            border-radius: 15px;
            display: inline-block;
            margin: 8px 0;
            max-width: 70%;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background: #003366;
        }

        .bot-message {
            align-self: flex-start;
            background: #003366;
        }

        .bot-message a {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }

        .bot-message a:hover {
            text-decoration: underline;
        }

        .bot-message b {
            font-size: 1.2em;
        }

        .input-container {
            padding: 10px;
            background: #ffffff;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
<body>
    <h2>Legal Chatbot</h2>
    <div class="chatbox" id="chatbox">
        <p class="bot-message"><b>Zia:</b> Hi there! I am your Legal Chatbot...<br> Feel free to ask me any legal question.</p>
    </div>
    <div class="input-container">
        <input type="text" id="question" placeholder="Type your question..." onkeydown="checkEnter(event)">
        <button onclick="askBot()">Ask</button>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') {
                askBot();
            }
        }

        function askBot() {
            let userInput = document.getElementById("question").value;
            if (!userInput.trim()) return;

            let chatbox = document.getElementById("chatbox");
            let userMessage = document.createElement("p");
            userMessage.className = "user-message";
            userMessage.innerHTML = `<b>You:</b> ${userInput}`;
            chatbox.appendChild(userMessage);

            fetch("http://127.0.0.1:5000/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: userInput })
            })
            .then(response => response.json())
            .then(data => {
                let botMessage = document.createElement("p");
                botMessage.className = "bot-message";

                if (data.results) {
                    botMessage.innerHTML = `<b>Zia:</b> Here are some legal acts related to your query:<br>`;
                    data.results.forEach(item => {
                        botMessage.innerHTML += `<b>${item.title}</b> - <a href="${item.url}" target="_blank">Click here to view</a><br>`;
                    });
                } else if (data.answer) {
                    botMessage.innerHTML = `<b>Zia:</b> ${data.answer}`;
                } else {
                    botMessage.innerHTML = `<b>Zia:</b> Sorry, something went wrong.`;
                }

                chatbox.appendChild(botMessage);
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                let botMessage = document.createElement("p");
                botMessage.className = "bot-message";
                botMessage.innerHTML = `<b>Zia:</b> Sorry, something went wrong.`;
                chatbox.appendChild(botMessage);
            });

            document.getElementById("question").value = "";
        }
    </script>
</body>
</html>
