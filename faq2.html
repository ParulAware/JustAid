  const faqContainer = document.getElementById('faq-container');
  const submitForm = document.getElementById('submit-form');

  function searchFAQ() {
    const query = document.getElementById('search').value.toLowerCase();
    faqContainer.innerHTML = ''; // clear previous results
    let found = false;

    faqs.forEach(faq => {
      if (faq.question.toLowerCase().includes(query)) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.innerText = faq.question;
        const answer = document.createElement('p');
        answer.innerText = faq.answer;
        details.appendChild(summary);
        details.appendChild(answer);
        faqContainer.appendChild(details);
        found = true;
      }
    });

    submitForm.style.display = found || query === '' ? 'none' : 'block';
  }

  function submitQuestion() {
    const question = document.getElementById('search').value;
    alert(`Thanks for submitting your question:\n"${question}"\nOur team will look into it!`);
    // You could also send this to a server if needed
  }

  // Optional: Show all FAQs on initial load
  window.onload = () => {
    faqs.forEach(faq => {
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.innerText = faq.question;
      const answer = document.createElement('p');
      answer.innerText = faq.answer;
      details.appendChild(summary);
      details.appendChild(answer);
      faqContainer.appendChild(details);
    });
    submitForm.style.display = 'none';
  };

    let lastSearchQuery = "";

    function displayFAQs(data) {
      const container = document.getElementById('faq-container');
      container.innerHTML = '';
      document.getElementById('submit-form').style.display = 'none';

      if (data.length === 0) {
        container.innerHTML = '<p>No FAQs found for your question.</p>';
        document.getElementById('submit-form').style.display = 'block';
      } else {
        data.forEach(faq => {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = faq.question;

          const p = document.createElement('p');
          p.textContent = faq.answer;

          details.appendChild(summary);
          details.appendChild(p);
          container.appendChild(details);
        });
      }
    }

    function searchFAQ() {
      const keyword = document.getElementById('search').value.trim().toLowerCase();
      lastSearchQuery = keyword;

      if (!keyword) {
        alert("Please enter a keyword or question.");
        return;
      }

      const filtered = faqs.filter(f =>
        f.question.toLowerCase().includes(keyword) ||
        f.answer.toLowerCase().includes(keyword)
      );

      displayFAQs(filtered);
    }

    function submitQuestion() {
      if (!lastSearchQuery) return;

      const formatted = lastSearchQuery.charAt(0).toUpperCase() + lastSearchQuery.slice(1) + "?";
      faqs.push({ question: formatted, answer: "To be answered" });

      alert("Question submitted! You can download the updated file.");
      displayFAQs([{ question: formatted, answer: "To be answered" }]);
      document.getElementById('submit-form').style.display = 'none';
    }

    window.onload = () => displayFAQs(faqs);

    if (e.key === 'Enter') {
        searchFAQ();
    }
