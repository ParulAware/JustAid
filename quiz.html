<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legal Rights Quiz</title>
  <link rel="icon" href="C:\Users\skawa\OneDrive\Desktop\pbl\JUSTAID  LOGO.png" sizes="512x512"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="quizdata.js" defer></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      color: #333;
      padding: 20px;
      margin: 0;
    }

    header {
      background-color: #003366;
      padding: 10px 20px;
      color: white;
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
      border-bottom: 5px solid #0056b3;
    }

    h2 {
      color: #003366;
      font-weight: 700;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }

    .selectors {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      min-width: 200px;
    }

    label {
      font-weight: 500;
      margin: 10px 0 5px;
    }

    select, button {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      font-weight: bold;
      transition: background 0.3s;
      cursor: pointer;
      max-width: 400px;
      margin: 20px auto;
      display: block;
    }

    button:hover {
      background-color: #0056b3;
    }

    .quiz-box {
      background: #ffffff;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 800px;
    }

    .option {
      margin: 5px 0;
      display: block;
      padding: 8px;
      border-radius: 4px;
    }

    .correct {
      background-color: #d4edda;
      border-left: 5px solid #28a745;
    }

    .incorrect {
      background-color: #f8d7da;
      border-left: 5px solid #dc3545;
    }

    #timer {
      color: red;
      font-size: 1.4em;
      font-weight: 600;
      text-align: center;
      margin: 10px 0;
    }
    #result{
      color: rgb(0, 155, 13);
      font-size: 1.4em;
      font-weight: 600;
      text-align: center;
      margin: 10px 0;
    }
    #score-time-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 20px auto 10px;
    }
  </style>
</head>
<body>

  <header>Topic-Wise Legal Rights Quiz</header>

  <h2>Test Your Legal Knowledge</h2>

  <div id="score-time-container">
    <div id="result"></div>
    <div id="timer"></div>
  </div>

  <div class="selectors">
    <div class="select-group">
      <label for="topicSelector">Select a Topic:</label>
      <select id="topicSelector" onchange="loadLevels()">
        <option value="">-- Choose a topic --</option>
      </select>
    </div>

    <div class="select-group">
      <label for="levelSelector">Select Difficulty:</label>
      <select id="levelSelector" onchange="loadQuiz()">
        <option value="">-- Choose level --</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
  </div>

  <div id="quiz-container"></div>
  <button onclick="submitQuiz()">Submit Quiz</button>

  <script>
    function populateTopics() {
      const selector = document.getElementById("topicSelector");
      selector.innerHTML = '<option value="">-- Choose a topic --</option>';
      if (typeof quizData !== "undefined") {
        Object.keys(quizData).forEach(topic => {
          const option = document.createElement("option");
          option.value = topic;
          option.textContent = topic.replace(/_/g, " ").replace(/\b\w/g, l => l.toUpperCase());
          selector.appendChild(option);
        });
      } else {
        console.error("quizData is not defined");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof quizData !== "undefined") populateTopics();
    });

    let timerInterval;

    function loadLevels() {
      const level = document.getElementById("levelSelector").value;
      if (level) loadQuiz();
    }

    function loadQuiz() {
      clearInterval(timerInterval);
      document.getElementById("timer").innerText = "";
      document.getElementById("result").innerText = "";

      const topic = document.getElementById("topicSelector").value;
      const level = document.getElementById("levelSelector").value;
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = "";

      const questions = quizData[topic]?.[level];
      if (!questions) return;

      questions.forEach((q, index) => {
        quizContainer.innerHTML += `
          <div class="quiz-box" id="box${index}">
            <p><strong>Q${index + 1}:</strong> ${q.scenario}</p>
            ${q.options.map(opt => `
              <label class="option">
                <input type="radio" name="q${index}" value="${opt}"> ${opt}
              </label>
            `).join('')}
          </div>
        `;
      });

      startTimer();
    }

    function startTimer() {
      let timeRemaining = 60;
      const timerDisplay = document.getElementById("timer");
      timerDisplay.innerText = `Time Left: 1:00`;

      timerInterval = setInterval(() => {
        timeRemaining--;
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timerDisplay.innerText = `Time Left: ${minutes}:${seconds < 10 ? "0" + seconds : seconds}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerDisplay.innerText = "Time's up!";
          submitQuiz();
        }
      }, 1000);
    }

    function submitQuiz() {
      clearInterval(timerInterval);
      const topic = document.getElementById("topicSelector").value;
      const level = document.getElementById("levelSelector").value;
      const questions = quizData[topic]?.[level];
      if (!questions) return;

      let score = 0;

      questions.forEach((q, index) => {
        const options = document.getElementsByName(`q${index}`);
        let userAnswer = null;
        options.forEach(opt => {
          if (opt.checked) userAnswer = opt.value;
        });

        const box = document.getElementById(`box${index}`);
        const allOptions = box.querySelectorAll("input");

        allOptions.forEach(input => {
          const label = input.parentElement;
          if (input.value === q.correct) {
            label.classList.add("correct");
          } else if (input.checked && input.value !== q.correct) {
            label.classList.add("incorrect");
          }
          input.disabled = true;
        });

        if (userAnswer === q.correct) score++;
      });

      document.getElementById("result").innerText = `Your Score: ${score} / ${questions.length}`;
    }
  </script>
</body>
</html>
