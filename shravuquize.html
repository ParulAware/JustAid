  function loadLevels() {
    const levelSelector = document.getElementById("level-selector");
    levelSelector.style.display = "block";
  }

  function loadQuiz() {
    const topic = document.getElementById("topic-selector").value;
    const level = document.getElementById("level-selector").value;
    const quizContainer = document.getElementById("quiz-container");
    const submitButton = document.querySelector("button");

    quizContainer.innerHTML = "";
    submitButton.style.display = "block";

    const questions = quizData[topic][level];
    questions.forEach((q, index) => {
      quizContainer.innerHTML += `
        <div class="quiz-box">
          <p><strong>Q${index + 1}:</strong> ${q.scenario}</p>
          ${q.options.map(opt => `
            <label class="option">
              <input type="radio" name="q${index}" value="${opt}"> ${opt}
            </label>
          `).join('')}
        </div>
      `;
    });
  }

  function submitQuiz() {
    const topic = document.getElementById("topic-selector").value;
    const level = document.getElementById("level-selector").value;
    const questions = quizData[topic][level];
    let score = 0;

    questions.forEach((q, index) => {
      const selected = document.querySelector(input[name="q${index}"]:checked);
      if (selected && selected.value === q.correct) score++;
    });

    document.getElementById("result").innerText = Your Score: ${score} / ${questions.length};
  }
</script>
