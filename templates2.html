<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Templates</title>
    <link rel="icon" href="C:\Users\skawa\OneDrive\Desktop\pbl\JUSTAID  LOGO.png" sizes="512x512" />
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Styling for the page */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }
    
        header {
            background-color: #003366;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    
        header .logo img {
            height: 50px;
        }
    
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 15px;
        }
    
        nav ul li {
            display: inline;
        }
    
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
    
        nav ul li a:hover {
            color: #FFD700;
        }
    
        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
    
        h1 {
            text-align: center;
            color: #003366;
            font-size: 28px;
            margin-bottom: 20px;
        }
    
        p {
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }
    
        /* Styling for the template cards */
        .templates-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }
    
        .template-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: calc(33.33% - 20px); /* Adjust for 3 cards per row */
            box-sizing: border-box;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px; /* Ensure uniform height */
        }
    
        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    
        .template-card h3 {
            font-size: 16px;
            font-weight: 500;
            margin: 10px 0;
            color: #007BFF;
            white-space: normal;
            word-break: break-word;
            overflow: visible;
            line-height: 1.5;
        }
    
        .template-card a {
            display: inline-block;
            padding: 10px 15px;
            background-color: #28A745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.3s;
        }
    
        .template-card a:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>
    
    
</head>
<body>
    <header>
        <div class="logo">
            <img src="JUSTAID  LOGO.png" alt="JUSTAID">
        </div>
        <nav>
            <ul>
                <li><a href="index1.html">Home</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="templates.html">Legal Templates</a></li>
                <li><a href="consultation.html">Consultation</a></li>
                
                <!-- Updated Free Resources dropdown -->
                <li class="dropdown">
                    <a href="#">Free Resources</a>
                    <ul>
                        <li><a href="http://127.0.0.1:5001/">eBook</a></li>
                        <li><a href="quiz.html">Quizzes</a></li>
                        <li><a href="http://localhost:8000/rescue_mission.html">Game</a></li>

                    </ul>
                </li>

                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Legal Document Templates</h1>
        <p>Select and download the legal template you need:</p>
        <div id="templates-container" class="templates-container">
            Loading templates...
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const templatesContainer = document.getElementById('templates-container');
            try {
                const response = await fetch('http://localhost:3000/api/templates');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const templates = await response.json();

                if (templates.length === 0) {
                    templatesContainer.innerHTML = '<p>No templates found.</p>';
                    return;
                }

                templatesContainer.innerHTML = ''; // Clear loading message

                templates.forEach(template => {
                    const templateCard = document.createElement('div');
                    templateCard.className = 'template-card';
                    templateCard.innerHTML = `
                        <h3>${template.name}</h3>
                        <a href="http://localhost:3000${template.filePath}" download>Download</a>
                    `;

                    templatesContainer.appendChild(templateCard);
                });
            } catch (error) {
                templatesContainer.innerHTML = '<p>Error loading templates. Please try again later.</p>';
                console.error('Error fetching templates:', error);
            }
        }
    );
    </script>
</body>
</html>
