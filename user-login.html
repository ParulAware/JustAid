<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="C:\Users\skawa\OneDrive\Desktop\pbl\JUSTAID  LOGO.png" sizes="512x512" />
    <title>User Login</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #003366;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #003366;
            padding: 50px;
            border-radius: 10px;
            text-align: center;
            width: 400px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 20px;
            border: none;
            font-size: 16px;
        }
        input {
            background-color: #ffffff;
            color: #003366;
        }
        button {
            background-color: #ffffff;
            color: #003366;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 style="color: white;">User Login</h2>
        <input type="email" id="email" placeholder="Enter your email">
        <input type="password" id="password" placeholder="Enter your password">
        <button onclick="handleLogin()">Login</button>
        <p style="color:white;">New here? 
            <a href="register.html" style="color: #fff; text-decoration: underline;">Create an account</a>
        </p>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const users = JSON.parse(localStorage.getItem("users")) || [];

            const user = users.find(u => u.email === email && u.password === password && u.role === "user");

            if (user) {
                sessionStorage.setItem("loggedInUser", JSON.stringify(user));
                alert("Login successful!");
                window.location.href = "index1.html";
            } else {
                alert("Incorrect email/password or not a user.");
            }
        }
    </script>
</body>
</html>
